[project]
name = "rshiny-dashboard-pipeline"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "lxml>=6.1.0",
    "lxml-stubs>=0.5.1",
    "anthropic>=0.102.0",
    "pydantic>=2.13.4",
    "pandera>=0.31.1",
    "pandas>=3.0.3",
    "biopython>=1.87",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "psycopg2-binary>=2.9.12",
    "sqlalchemy>=2.0.49",
    "python-dotenv>=1.2.2",
    "argcomplete>=3.6.3",
    "rich>=15.0.0",
    "PyMuPDF>=1.27.2.3",
    "apprise>=1.10.0",
    "tenacity>=9.1.4",
    "jinja2>=3.1.6",
    "matplotlib>=3.10.9",
    "plotly>=6.7.0",
    "scikit-learn>=1.8.0",
    "nicegui>=3.12.0",
    "selenium>=4.44.0",
    "playwright>=1.59.0",
    "kaleido>=1.3.0",
    "python-pptx>=1.0.2",
    "ipykernel>=7.2.0",
    "pyarrow>=24.0.0",
]

[dependency-groups]
dev = [
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.13",
    "ty>=0.0.36",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["pipeline"]
extend-exclude = ["pipeline/alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E = pycodestyle errors, F = pyflakes, I = isort
# UP = pyupgrade, B = flake8-bugbear, SIM = flake8-simplify

[tool.ruff.lint.per-file-ignores]
# SVG string literals make short lines impractical
"scripts/python_plot.py" = ["E501", "SIM108"]
# LLM prompt strings — line wrapping breaks readability
"pipeline/prompts.py" = ["E501"]
# Fast-path for shell tab-completion requires heavy imports to load lazily
# after argparse parsing, so module-level imports appear mid-file by design.
"pipeline/main.py" = ["E402"]
# NiceGUI entry point: sys.path modification before imports is intentional;
# nicegui and pipeline_app_hpc are both third-party but ruff's isort wants
# them in the same block (no blank line). Suppress the resulting I001.
"pipeline_app_hpc/main.py" = ["E402", "I001"]
# unsloth must import before trl/torch so its kernel-fusion monkey-patches
# land on the originals rather than already-imported copies.
"scripts/finetune/train_unsloth.py" = ["I001", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests/pipeline", "tests/pipeline_app", "tests/pipeline_app_hpc", "tests/scripts"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]

[tool.ty.environment]
python-version = "3.14"
# scripts/tuning/* import validate_pipeline.py from scripts/ root via
# sys.path.insert at runtime — surface the same path to the resolver.
extra-paths = ["scripts"]

[tool.ty.rules]
# Third-party packages may not have type stubs available
unresolved-import = "warn"
