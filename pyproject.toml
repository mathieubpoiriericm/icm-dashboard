[project]
name = "rshiny-dashboard-pipeline"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.24.0",
    "lxml>=4.9.0",
    "lxml-stubs>=0.5.1",
    "anthropic>=0.25.0",
    "ollama>=0.4.0",
    "mlx-lm[train]>=0.20.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pydantic>=2.0.0",
    "pandera>=0.18.0",
    "pandas>=2.0.0",
    "biopython>=1.81",
    "asyncpg>=0.28.0",
    "alembic>=1.15.0",
    "psycopg2-binary>=2.9.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "argcomplete>=3.0.0",
    "rich>=13.0.0",
    "PyMuPDF>=1.23.0",
    "apprise>=1.9.7",
    "tenacity>=9.1.4",
    "jinja2>=3.1.6",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
    "nicegui>=2.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "ty>=0.0.1a0",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["pipeline"]
extend-exclude = ["pipeline/alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E = pycodestyle errors, F = pyflakes, I = isort
# UP = pyupgrade, B = flake8-bugbear, SIM = flake8-simplify

[tool.ruff.lint.per-file-ignores]
# SVG string literals make short lines impractical
"scripts/python_plot.py" = ["E501", "SIM108"]
# LLM prompt strings — line wrapping breaks readability
"pipeline/prompts.py" = ["E501"]
# Fast-path for shell tab-completion requires heavy imports to load lazily
# after argparse parsing, so module-level imports appear mid-file by design.
"pipeline/main.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["pipeline"]

[tool.pytest]
testpaths = ["tests/pipeline", "tests/pipeline_app"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
# Third-party packages may not have type stubs available
unresolved-import = "warn"
